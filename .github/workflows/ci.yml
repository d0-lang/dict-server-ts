# The checks every pull request has to pass. They need no dictionary files.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # The version the Dockerfile runs.
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # Kiwi's model, which the Korean tests load. A kiwi-nlp upgrade adds its
      # checksum to the script, which changes the key; the script refetches
      # whenever the stamp differs from the installed package anyway.
      - uses: actions/cache@v4
        with:
          path: models/kiwi
          key: kiwi-model-${{ hashFiles('apps/server/scripts/kiwi-model.ts') }}
      - run: bun run kiwi:model
      - run: bun run typecheck
      - run: bun run test
      - run: bun run format:check

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag dict-server .
      # compose.yaml is attached to each release; it has to stay valid.
      - run: docker compose config --quiet
      # As release.yml pins it: the image line must still be there to rewrite.
      - run: grep -qF 'dict-server-ts:${DICT_VERSION:-latest}' compose.yaml
