name: Server bug
description: For people who run a server. Something in the server itself is broken.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The release, or the output of `git rev-parse --short HEAD`.
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: How it runs
      options:
        - Docker
        - Bun
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: The request
      description: 'Method, path and body, e.g. `POST /v1/lookup {"word": "Hund", "lang": "de_en"}`.'
      render: text
    validations:
      required: true
  - type: textarea
    id: response
    attributes:
      label: The response
      description: Status and body.
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log lines
      description: The server's lines around the request.
      render: text
    validations:
      required: false
