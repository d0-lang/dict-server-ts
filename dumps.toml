# Which dump snapshot each language is imported from: a pre-release of this
# repo, `dump-<date>`, with one gzipped <lang>.jsonl per language. The dump
# canary (.github/workflows/canary.yml) makes the snapshots and opens the PR
# that moves these pins.

[languages]
de = "dump-2026-10-30"
fr = "dump-2026-10-30"
ja = "dump-2026-10-30"
pl = "dump-2026-10-30"
ru = "dump-2026-10-30"
uk = "dump-2026-10-30"
