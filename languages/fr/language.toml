#:schema ../../spec/language.schema.json
# French. Settings left out take their defaults (spec/language.schema.json).

code = "fr"
name = "French"
target = "en"

# Articles, pronouns and conjunctions lose their vowel before a vowel and are
# written onto the next word (`l'homme`, `d'une`, `qu'il`, `n'est`), and
# segmenters keep the two as one word: 6% of the corpus's words, half of them
# without an entry of their own. Such a word shows both: `homme`, then `le`.
elision = true

[import]
# Old and Middle French are separate languages in the dump (fro, frm), not
# tags on French senses.
historicalStages = []
standardPronNotes = []
# Nouns and adjectives have no inflection tables: their plurals are on the
# headword line, and Wiktionary often has no page for a regular plural, or one
# with only a verb form (`structures`, `réformes`). 300 corpus words reached the
# verb and missed their noun or adjective (`protons`, `combats`, `notions`).
headwordInflections = true
# Past participles agree like adjectives, but verb tables list the masculine
# singular only: adopté also gives adoptée, adoptés, adoptées. Wiktionary lists
# many participles as adjectives or nouns with other senses (`adopté` "male
# adoptee"), whose forms then missed the verb (`adoptés` "adopted"), so those
# don't block a form, nor does a noun spelled like it (`arrivée` "arrival" in
# `elle est arrivée`); another word's does (`plus` the adverb isn't `plu` + s:
# 464 popovers of `plus` gained `plaire` without this).
participleDeclension = { tags = ["participle", "past"], ending = "", endings = ["e", "s", "es"], onlyNew = true, sharedWithParticiple = true }

[context]
# Words are hyphen-joined (`peut-être`, `c'est-à-dire`, `lui-même`), and the
# segmenter splits them at the hyphen.
hyphenWords = true
# The prepositions de and à merge with the article after them (du, des, au,
# aux, jusqu'au), and que and de are elided before a vowel. A phrase ending in
# one of them still matches: `à partir du`, `parce qu'il`, `afin d'éviter`,
# `en train d'essayer`, `grâce au`.
contractions = { du = "de", des = "de", au = "à", aux = "à", "jusqu'au" = "jusqu'à", "jusqu'aux" = "jusqu'à", "d'" = "de", "qu'" = "que" }
# The noun whose lemma a word is ranks before the verb whose form it is
# (`passe` "pass" before `passer`, `oublie` "wafer" before `oublier`). The
# neighbouring word says which one the sentence means.
# A verb follows subject pronouns (je, tu, il, elle, on, ils, elles), the
# negation (ne, n') and the object pronouns that are nothing else (me, te,
# se), and qui, the subject of the verb after it: `je passe`, `n'oublie`,
# `qui dit`. Left out: le, la, les, l' and en (also articles and a
# preposition), lui, leur, nous, vous (also stressed pronouns or a
# determiner) and y: `je vais le dire` keeps its order anyway.
verbAfter = ["je", "j'", "tu", "il", "elle", "on", "ils", "elles", "ne", "n'", "me", "m'", "te", "t'", "se", "s'", "qui"]
# A verb stands before an inverted subject (`dit-il`, `va-t-il`, with the t
# put in before a vowel) or an imperative's object (`donne-moi`,
# `dépêche-toi`, `vas-y`, `prends-en`), joined by a hyphen.
verbBeforeJoined = ["je", "tu", "il", "elle", "on", "nous", "vous", "ils", "elles", "moi", "toi", "le", "la", "les", "lui", "leur", "y", "en", "t"]
# Determiners that are never a pronoun: no verb follows them, so `des
# mesures` opens on the noun, not `mesurer`. Left out: le, la, les, l' and
# leur, also object pronouns (`je vais le dire`), and de (`de dire`).
noVerbAfter = ["un", "une", "des", "du", "au", "aux", "ce", "cet", "cette", "ces", "mon", "ton", "son", "ma", "ta", "sa", "mes", "tes", "ses", "notre", "votre", "nos", "vos", "leurs", "quelques", "plusieurs", "chaque"]
# All but one of the past participles in the dump's verb tables end in one
# of these (8,306 of 8,307: é 7,399, i 445, u 250, it 86, is 48, int 33, ert 12, us 12, û 6,
# os 6, ï 7, ort 2), so after être or avoir `partie`, `dit`, `mis` and `vue`
# open on their verb, not the noun.
participleEndings = ["é", "i", "u", "û", "ï", "is", "it", "int", "ert", "ort", "os", "us"]
