#:schema ../../spec/language.schema.json
# Polish. Settings left out take their defaults (spec/language.schema.json).

code = "pl"
name = "Polish"
target = "en"

[import]
# wiktextract splits "Middle Polish" into the tags "Middle" and "Polish".
historicalStages = [["Middle", "Polish"], ["Old", "Polish"]]
standardPronNotes = ["normal speech", "prescriptive"]
# Learners learn reflexive verbs as words of their own: bawić "to amuse",
# bawić się "to play". Senses labelled "reflexive with się" (or sobie) become
# their own entry, bawić się, with the verb's forms.
reflexive = "after"
# Participles decline like adjectives, and tables list their nominatives only:
# wymagany also gives wymaganego, wymaganej, wymaganemu, wymaganym, wymaganymi,
# wymaganych, wymaganą (-ący likewise: należącej, dominującą).
participleDeclension = { ending = "y", endings = ["ego", "ej", "emu", "ym", "ymi", "ych", "ą"] }

[context]
# Negation puts the verb's object in the genitive (`mieć znaczenie` -> `nie ma
# znaczenia`), so a negated verb phrase is matched with its other words in any
# form. The gap stays 1: two words let in as many literal readings as idioms
# (`jesteśmy u Mikołaja w domu` isn't `być w domu`).
negation = "nie"
# A reflexive verb's particle (bawić się) often stands before the verb, and
# apart from it: "Dobrze się bawię", "Bardzo się dziś bawiliśmy".
reflexiveParticles = ["się", "sobie"]
