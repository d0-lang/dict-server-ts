# What Ukrainian's labels mean, in English (the pair's target language), for
# `/v1/get-labels`. Names come from `languages/labels.en.toml` unless given
# here. `text` at most 1000 characters, plain text.

[m]
text = "Masculine nouns take masculine adjectives and past-tense forms: новий будинок, він прийшов."

[f]
text = "Feminine nouns take feminine adjectives and past-tense forms: нова книга, вона прийшла."

[n]
text = "Neuter nouns take neuter adjectives and past-tense forms: нове вікно, воно відчинилося."

[anim]
text = "The noun names a person or an animal. Its accusative is the same as its genitive in the plural, and in the singular of masculine nouns like брат: бачу брата."

[inan]
text = "The noun names a thing or an idea. Its accusative is the same as its nominative in the plural, and in the singular of masculine nouns like дім: бачу дім."

[impf]
text = "The action is seen as a process: going on, repeated or habitual, without saying whether it is finished. Most verbs come in pairs: писати (impf) and написати (pf)."

[pf]
text = "The action is seen as a whole, usually completed. Most verbs come in pairs: писати (impf) and написати (pf)."

[pl]
text = "The noun has no singular: ножиці (scissors), двері (door). It takes plural adjectives and verbs."
